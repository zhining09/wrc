# RealSense D405 for a fixed close-range camera setup.
type: realsense
device_model: D405
serial: null
width: 848
height: 480
fps: 15
match_depth_resolution: true
min_depth_m: 0.07
max_depth_m: 0.65  # The box in the fixed tabletop setup reaches past 0.50 m.
warmup_frames: 15

extrinsics:
  mode: eye_to_hand
  source: "${repo}/data/calibration/hand_eye_d405.local.json"
  hand_eye_compensation_m:
    x: 0.00
    y: 0.00
    z: 0.00

requires_calibration: true
fuse_beliefs: true
