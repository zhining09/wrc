# Intel RealSense D435i (stereo). Works with stock pyrealsense2 wheels too.
type: realsense
device_model: D435i
serial: null
width: 1280
height: 720
fps: 30
min_depth_m: 0.15
max_depth_m: 2.0
warmup_frames: 15

extrinsics:
  mode: eye_to_hand
  source: "${repo}/data/calibration/hand_eye_d435i.local.json"
  hand_eye_compensation_m:
    x: 0.00
    y: 0.00
    z: 0.00

requires_calibration: true
fuse_beliefs: true
